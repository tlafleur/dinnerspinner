<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Dinner Spinner</title>
  <meta name="description" content="Spin the wheel, pull the lever, feed the family. A playful meal planner that runs entirely in your browser.">
  <meta name="theme-color" content="#FF6B6B" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1D1633" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dinner Spinner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#spin"><span class="brand-logo">🎡</span><span class="brand-name">Dinner Spinner</span></a>
    <nav class="top-nav">
      <button class="topbtn" id="soundbtn" title="Mute" aria-label="Toggle sound">🔊</button>
      <a class="topbtn" href="#meals" title="Meal library" aria-label="Meal library">📖</a>
      <a class="topbtn" href="#settings" title="Settings" aria-label="Settings">⚙️</a>
    </nav>
  </header>
  <main id="main" class="main"></main>
  <nav class="tabs" aria-label="Main">
    <a class="tab" href="#spin"><span class="tab-emoji">🎡</span><span>Tonight</span></a>
    <a class="tab" href="#week"><span class="tab-emoji">🎰</span><span>Week</span></a>
    <a class="tab" href="#shop"><span class="tab-emoji">🛒</span><span>Shop</span></a>
    <a class="tab" href="#pantry"><span class="tab-emoji">🧺</span><span>Pantry</span></a>
    <a class="tab" href="#family"><span class="tab-emoji">👨‍👩‍👧</span><span>Family</span></a>
  </nav>
  <noscript>Dinner Spinner needs JavaScript to spin.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
